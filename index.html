    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acesso Bloqueado</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050508;
            --box-bg: #121216;
            --primary: #00f2fe;
            --secondary: #fe0979;
            --text-light: #ffffff;
            --text-muted: #888899;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at 20% 0%, rgba(0, 242, 254, 0.08) 0%, transparent 40%),
                              radial-gradient(circle at 80% 100%, rgba(254, 9, 121, 0.08) 0%, transparent 40%);
        }

        /* TELA PRINCIPAL DO JOGO */
        #gameScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            transition: opacity 0.5s ease;
        }

        .header { text-align: center; margin-bottom: 30px; animation: fadeIn 0.8s ease; }
        .icon-blocked { width: 60px; height: 60px; background: rgba(255, 59, 48, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; box-shadow: 0 0 20px rgba(255, 59, 48, 0.3); animation: pulseIcon 2s infinite; }
        @keyframes pulseIcon { 0% { box-shadow: 0 0 20px rgba(255, 59, 48, 0.3); transform: scale(1); } 50% { box-shadow: 0 0 35px rgba(255, 59, 48, 0.6); transform: scale(1.05); } 100% { box-shadow: 0 0 20px rgba(255, 59, 48, 0.3); transform: scale(1); } }
        .icon-blocked svg { width: 35px; height: 35px; color: #ff3b30; }
        .title { font-size: 1.6rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
        .title-red { color: #ff3b30; }
        .subtitle { color: var(--text-muted); font-size: 0.95rem; }
        .subtitle b { color: var(--text-light); }
        .game-container { width: 90%; max-width: 380px; background: linear-gradient(145deg, rgba(25,25,30,0.8), rgba(15,15,20,0.8)); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 28px; padding: 50px 20px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05); margin-bottom: 30px; backdrop-filter: blur(10px); }
        .emoji-btn { font-size: 110px; background: none; border: none; cursor: pointer; outline: none; display: inline-block; animation: pulseEmoji 1.5s infinite; filter: drop-shadow(0 0 25px rgba(255,255,255,0.15)); user-select: none; }
        @keyframes pulseEmoji { 0% { transform: scale(1); } 50% { transform: scale(1.15); filter: drop-shadow(0 0 40px rgba(0, 242, 254, 0.4)); } 100% { transform: scale(1); } }
        #emojiIcon { display: inline-block; transition: transform 1s cubic-bezier(0.25, 1, 0.5, 1); }
        .click-text { margin-top: 35px; font-size: 1.15rem; font-weight: 900; color: var(--primary); height: 28px; transition: all 0.3s; text-shadow: 0 0 15px rgba(0, 242, 254, 0.5); text-transform: uppercase; }
        .progress-container { width: 85%; max-width: 350px; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255, 255, 255, 0.08); border-radius: 10px; overflow: hidden; position: relative; box-shadow: inset 0 1px 3px rgba(0,0,0,0.5); }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 10px; transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1); box-shadow: 0 0 15px var(--secondary); }
        .progress-text { text-align: center; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-top: 12px; letter-spacing: 0.5px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        /* TELA DE CARREGAMENTO (QUADRADO) */
        #loadingScreen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            background-color: var(--bg-color);
            z-index: 50;
            animation: fadeIn 0.5s ease;
        }

        .square-wrapper {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .loading-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.4));
        }

        .animated-border {
            /* Propriedades controladas pelo JavaScript para garantir compatibilidade */
        }


        
        .loading-subtitle {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary);
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
            letter-spacing: 2px;
            animation: pulseText 1.5s infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes pulseSquare {
            0% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.4)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 40px rgba(0, 242, 254, 0.8)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.4)); }
        }

        .pulse-animation {
            animation: pulseSquare 0.8s ease-in-out infinite;
        }
    </style>
</head>
<body>

    <!-- TELA 1: JOGO -->
    <div id="gameScreen">
        <div class="header">
            <div class="icon-blocked">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                </svg>
            </div>
            <div class="title">SIGA OS PASSOS <span class="title-red">PARA LIBERAR</span></div>
            <div class="subtitle">Toque 💖 para <b>LIBERAR!</b></div>
        </div>

        <div class="game-container">
            <button class="emoji-btn" id="emojiBtn"><span id="emojiIcon">🎁</span></button>
            <div class="click-text" id="clickText">LIBERE AQUI!</div>
        </div>

        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0 / 3 — LIBERANDO...</div>
        </div>
    </div>

    <!-- TELA 2: CARREGAMENTO QUADRADO -->
    <div id="loadingScreen">
        <div class="square-wrapper">
            <svg class="loading-svg" viewBox="0 0 250 250">
                <defs>
                    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00f2fe" />
                        <stop offset="100%" stop-color="#fe0979" />
                    </linearGradient>
                </defs>
                <!-- Fundo do quadrado escuro (caminho fechado) -->
                <path class="dark-track" d="M 125 10 L 215 10 A 25 25 0 0 1 240 35 L 240 215 A 25 25 0 0 1 215 240 L 35 240 A 25 25 0 0 1 10 215 L 10 35 A 25 25 0 0 1 35 10 L 125 10" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="8" />
                
                <!-- Borda animada colorida (única, dá a volta completa e cobre o fundo) -->
                <path class="animated-border single-track" id="animatedSquare" d="M 125 10 L 215 10 A 25 25 0 0 1 240 35 L 240 215 A 25 25 0 0 1 215 240 L 35 240 A 25 25 0 0 1 10 215 L 10 35 A 25 25 0 0 1 35 10 L 125 10" fill="none" stroke="url(#boxGrad)" stroke-width="10" stroke-dasharray="878" stroke-dashoffset="878" stroke-linecap="round" />
            </svg>
        </div>
        <div class="loading-subtitle" id="finalMessage">PROCESSANDO...</div>
    </div>

    <script>
        const emojiBtn = document.getElementById('emojiBtn');
        const emojiIcon = document.getElementById('emojiIcon');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const clickText = document.getElementById('clickText');
        
        // Elementos da Nova Tela
        const gameScreen = document.getElementById('gameScreen');
        const loadingScreen = document.getElementById('loadingScreen');
        const animatedSquare = document.getElementById('animatedSquare');
        const squareText = document.getElementById('squareText');
        const finalMessage = document.getElementById('finalMessage');

        // Randomizar o emoji a cada acesso
        const emojis = ['💖', '🩷', '🧡', '💛', '💚', '💙', '🖤', '🤍'];
        emojiIcon.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];

        let clicks = 0;
        const maxClicks = 3;
        let currentRotation = 0;

        const messages = [
            "CLIQUE AQUI!",
            "ISSO! CLIQUE DE NOVO!",
            "SÓ MAIS UMA VEZ!",
            "DESBLOQUEADO!"
        ];

        emojiBtn.addEventListener('click', () => {
            if (clicks >= maxClicks) return;

            clicks++;
            currentRotation += 1080; 
            emojiIcon.style.transform = `rotate(${currentRotation}deg)`;
            
            const percentage = (clicks / maxClicks) * 100;
            progressFill.style.width = percentage + '%';
            progressText.innerHTML = `${clicks} / ${maxClicks} — Desbloqueando...`;
            clickText.innerHTML = messages[clicks];

            if (clicks === maxClicks) {
                clickText.style.color = 'var(--secondary)';
                clickText.style.textShadow = '0 0 15px rgba(254, 9, 121, 0.5)';
                emojiBtn.style.animation = 'none';
                emojiBtn.style.transform = `scale(1.2)`;
                
                // Mudar para a tela do quadrado após pequeno delay
                setTimeout(() => {
                    gameScreen.style.display = 'none';
                    loadingScreen.style.display = 'flex';
                    
                    // Inicia animação do quadrado
                    const animatedSquare = document.getElementById('animatedSquare');
                    const squareWrapper = document.querySelector('.square-wrapper');
                    
                    // Um pequeno atraso garante que o navegador renderizou a tela antes de ativar a transição
                    setTimeout(() => {
                        animatedSquare.style.transition = 'stroke-dashoffset 8s linear';
                        animatedSquare.style.strokeDashoffset = '0';
                    }, 50);
                    
                    // Aguarda 8 segundos (tempo da animação) para completar a volta
                    setTimeout(() => {
                        // Faz o quadrado pulsar quando termina
                        squareWrapper.classList.add('pulse-animation');
                        
                        // Aparece a mensagem CARREGANDO
                        finalMessage.innerHTML = "CARREGANDO...";
                        finalMessage.style.color = "var(--secondary)";
                        finalMessage.style.textShadow = "0 0 15px rgba(254, 9, 121, 0.5)";
                        
                        setTimeout(() => {
                            window.location.href = "https://t.me/amaeefilha_bot";
                        }, 1000); // 1 segundo pulsando antes de redirecionar
                    }, 8000);
                    
                }, 800);
            }
        });
    </script>
</body>
</html>
